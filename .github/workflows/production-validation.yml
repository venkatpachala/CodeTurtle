name: Production contract validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate validation configuration
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"CODETURTLE_HOME={Path(os.environ['RUNNER_TEMP']) / 'codeturtle-validation'}\n")
      - run: python -m pip install . pytest
      - run: python -m pytest tests/test_production_contract.py tests/test_review_result_v21.py tests/test_phase72_change_units.py tests/test_v4_bundles.py tests/test_v4_reflector.py tests/test_v4_symbols.py tests/test_v4_url_parse.py tests/evaluation/test_scorer.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_vnext_domain_contracts.py tests/test_contract_compatibility.py tests/test_input_snapshot.py tests/test_snapshot_runtime.py tests/test_semantic_changes.py tests/test_intent_runtime.py tests/test_verifier_response_contract.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_agent_document_parsing.py tests/test_proof_repair.py tests/test_proof_batches.py tests/test_paired_analysis.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_source_observations.py tests/test_requirement_investigator.py tests/test_requirement_first_runtime.py tests/test_review_result_v22.py tests/test_requirement_corpus.py tests/test_requirement_experiment.py tests/test_dataset_registration.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_comparison_snapshot.py tests/test_pr_source_preparation.py tests/test_pr_snapshot_investigation.py tests/test_source_finding_verifier.py tests/test_finding_verification_runtime.py tests/test_none_reachability.py tests/test_requirement_fixture_oracles.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_gateway_http.py tests/test_scoped_source_capture.py tests/test_none_len_source_rule.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_semantic_review.py tests/test_merge_safety_metrics.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_review_admission.py tests/test_durable_reviews.py tests/test_review_resume.py tests/test_behavior_contrasts.py tests/test_pure_contract_route.py tests/test_real_pilot.py tests/test_isolated_runner.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_pure_contract_verifier.py tests/test_diff_path_identity.py -q -p no:cacheprovider
      - run: python -m pytest tests/test_pilot_source.py -q -p no:cacheprovider
      - run: codeturtle review --help
      - run: codeturtle review-local --help
      - run: codeturtle jobs --help
      - run: codeturtle sandbox-check --help
