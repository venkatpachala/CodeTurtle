name: Production contract validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CODETURTLE_HOME: ${{ runner.temp }}/codeturtle-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest tests/test_production_contract.py tests/test_phase72_change_units.py tests/test_v4_bundles.py tests/test_v4_reflector.py tests/test_v4_symbols.py tests/test_v4_url_parse.py tests/evaluation/test_scorer.py -q -p no:cacheprovider
      - run: codeturtle review --help
