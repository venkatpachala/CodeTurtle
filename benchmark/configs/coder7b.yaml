run:
  model: qwen2.5-coder:7b
  provider: ollama
review:
  runtime: v4
  bundle_max: 4
  agent_max_steps: 4
verification:
  enabled: true
execution:
  enabled: false
benchmark:
  judge_model: qwen2.5-coder:7b
  judge_base_url: http://localhost:11434/v1
  graphify_timeout: 3600
  review_timeout: 900
release_gate:
  min_prs: 10
  min_precision: 0.80
  min_blocking_recall: 0.60
  max_fp_per_pr: 0.30
  min_agent_success_rate: 0.95
  max_p95_latency_seconds: 300
  min_decision_accuracy: 0.70
  max_over_blocking_rate: 0.10
