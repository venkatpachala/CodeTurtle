# Copy to: <your-repo>/.github/workflows/codeturtle-review.yml
# See docs/github-action.md
#
# Reviews opened / updated / reopened PRs with:
#   python -m cli.main review $GITHUB_REPOSITORY $PR --comment
# Default: no --execute-tests, no --execute-install.
# Skips drafts and dependabot[bot].

name: CodeTurtle review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not post to GitHub"
        type: boolean
        default: false
      execute_tests:
        description: "Opt-in pytest in the PR worktree (untrusted code)"
        type: boolean
        default: false
      python_version:
        description: "Python version"
        type: string
        default: "3.12"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >
      github.event_name != 'pull_request'
      || (
        github.event.pull_request.draft != true
        && github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    env:
      # PAT (CODETURTLE_GITHUB_TOKEN) wins in CodeTurtle if GITHUB_TOKEN 403s
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODETURTLE_GITHUB_TOKEN: ${{ secrets.CODETURTLE_GITHUB_TOKEN }}
      CODETURTLE_PR_DRAFT: ${{ github.event.pull_request.draft }}
      GRAPHIFY_GRAPH_PATH: ${{ github.workspace }}/graphify-out/graph.json
      CODETURTLE_CONFIG: ${{ github.workspace }}/.codeturtle.yaml
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.12' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install CodeTurtle
        env:
          CODETURTLE_GIT: ${{ vars.CODETURTLE_GIT }}
        run: |
          if [ -n "$CODETURTLE_GIT" ]; then
            uv pip install --system "codeturrle @ git+${CODETURTLE_GIT}"
          elif [ -f pyproject.toml ] && grep -q 'name = "codeturrle"' pyproject.toml; then
            uv sync --frozen || uv sync
          else
            echo "Set repository variable CODETURTLE_GIT to the CodeTurtle git URL" >&2
            echo "e.g. https://github.com/YOU/codeturtle.git" >&2
            exit 1
          fi

      - name: Graphify (code-only, no LLM)
        continue-on-error: true
        run: |
          if command -v graphify >/dev/null 2>&1; then
            graphify . --code-only
          elif python -c "import graphifyy" >/dev/null 2>&1; then
            python -m graphifyy . --code-only || true
          else
            echo "Graphify CLI not found; review will use GRAPHIFY_GRAPH_PATH if present"
          fi

      - name: Review PR
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ]; then
            echo "No pull_request.number (workflow_dispatch without a PR)" >&2
            exit 1
          fi
          DRY="${{ inputs.dry_run || false }}"
          EX="${{ inputs.execute_tests || false }}"
          ARGS=(python -m cli.main review "$REPO" "$PR")
          if [ "$DRY" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--comment)
          fi
          if [ "$EX" = "true" ]; then
            ARGS+=(--execute-tests)
          fi
          "${ARGS[@]}"
